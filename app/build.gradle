plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.iptv.online.smart.liveplayer.tv'
    compileSdk 36

    defaultConfig {
        applicationId "com.iptv.online.smart.liveplayer.tv"
        minSdk 24
        targetSdk 36
        versionCode 19

        versionName "1.18"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
        compose = true
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {

        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }


}

dependencies {
    // java.time desugaring (AppLovin java.time.Duration crash fix) -> jup 2️⃣ crash
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation("com.tbuonomo:dotsindicator:5.1.0")
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    // iptv2 jevu dev-settings dialog (language title 10-click e khule)
    implementation 'com.github.Infinity-Technologies-Global:DevConfig:1.0.3-partner'


    implementation("com.intuit.ssp:ssp-android:1.1.1")
    implementation("com.intuit.sdp:sdp-android:1.1.1")
    implementation("com.gauravbhola.ripplepulsebackground:library:1.0.1")
    implementation("com.airbnb.android:lottie:6.6.0")
    implementation(libs.shimmer)

    implementation(platform("com.google.firebase:firebase-bom:33.6.0"))
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'


    // OneSignal SDK
    implementation 'com.onesignal:OneSignal:5.9.2'

    // Network + Ads
    implementation(libs.app.update.ktx)

    implementation("com.github.Infinity-Technologies-Global:Module-Update-GDPR:2.0.2")
    // iptv2 jevu: local :ads module ne badle ERain ad SDK remote (com.ads.module.* aapé:
    // ERainAd, ApNativeAd, Admob, AppOpenManager, ERainAdConfig...)
    implementation("com.github.trongluan99:ERain-Studio:2.0")
    implementation("androidx.multidex:multidex:2.0.1")
//hilt
    implementation("com.google.dagger:hilt-android:2.57.2")
    kapt("com.google.dagger:hilt-android-compiler:2.57.2")

    implementation("androidx.lifecycle:lifecycle-viewmodel:2.9.4")
    implementation("androidx.lifecycle:lifecycle-extensions:2.2.0")
    implementation("androidx.hilt:hilt-navigation-fragment:1.3.0")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.9.4")

    //Google Ads
    implementation("com.google.android.gms:play-services-ads:24.7.0")
    implementation("com.facebook.shimmer:shimmer:0.5.0")
    //other

    implementation("io.github.inflationx:calligraphy3:3.1.1")
    implementation("io.github.inflationx:viewpump:2.0.3")



    // Navigation + Compose
    implementation("androidx.navigation:navigation-compose:2.5.3")
    implementation("androidx.activity:activity-compose:1.6.0")
    implementation("androidx.compose.ui:ui:1.2.1")
    implementation("androidx.compose.ui:ui-tooling-preview:1.2.1")
    implementation("androidx.compose.material:material:1.2.1")
    implementation("androidx.compose.material:material-icons-extended:1.2.1")
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.2.1")
    debugImplementation("androidx.compose.ui:ui-tooling:1.2.1")
    debugImplementation("androidx.compose.ui:ui-test-manifest:1.2.1")

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

}